<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sistema de Turnos v2</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Segoe UI,Arial,sans-serif;background:#f1f5f9}.pantalla{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}.card{background:#fff;width:700px;padding:30px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.15)}h1{text-align:center;margin-bottom:20px}label{display:block;margin:15px 0 5px;font-weight:bold}select{width:100%;padding:12px;border-radius:10px;border:1px solid #ccc}button{border:none;border-radius:10px;cursor:pointer}.btn-iniciar{width:100%;padding:15px;background:#2563eb;color:#fff;font-size:18px;margin-top:15px}.oculto{display:none}.turno{background:#2563eb;color:#fff;text-align:center;border-radius:20px;padding:30px}.numero{font-size:120px;font-weight:bold}.modulo{font-size:24px;margin-top:10px}.botones{display:flex;gap:10px;margin-top:20px}.botones button{flex:1;padding:15px;font-size:18px;color:white}.verde{background:#16a34a}.rojo{background:#dc2626}.gris{background:#475569}.historial{margin-top:20px}.historial ul{list-style:none}.historial li{padding:8px;border-bottom:1px solid #ddd}.info{margin-top:15px;background:#dbeafe;color:#1e40af;padding:10px;border-radius:10px;text-align:center;font-weight:bold}</style></head><body><div id="configuracion" class="pantalla"><div class="card"><h1>Sistema de Turnos</h1><label>Módulo de Atención</label><select id="modulo"><option>Admisión</option><option>Matrículas</option><option>Becas</option><option>Créditos</option></select><button class="btn-iniciar" onclick="iniciarSistema()">Iniciar Sistema</button><button class="btn-iniciar" style="background:#dc2626" onclick="limpiarHistorial()">Limpiar Últimos Llamados</button></div></div><div id="sistema" class="pantalla oculto"><div class="card"><div class="turno"><div>AHORA ATENDIENDO</div><div id="numeroTurno" class="numero">A01</div><div id="textoModulo" class="modulo">Admisión</div></div><div class="botones"><button class="verde" onclick="siguienteTurno()">Llamar Siguiente</button><button class="rojo" onclick="reiniciarSistema()">Reiniciar</button><button class="gris" onclick="volverConfiguracion()">Configuración</button></div><div class="historial"><h3>Últimos llamados</h3><ul id="historial"></ul></div><div class="info">✅ PageDown=Siguiente | ✅ PageUp=Anterior</div></div></div><script>let serie='A',numeroActual=1,modulo='Admisión',historial=[];window.onload=()=>{const d=localStorage.getItem('turnos');if(d){const c=JSON.parse(d);serie=c.serie||'A';numeroActual=c.numeroActual||1;modulo=c.modulo||'Admisión';historial=c.historial||[];}};function guardar(){localStorage.setItem('turnos',JSON.stringify({serie,numeroActual,modulo,historial}));}function iniciarSistema(){modulo=document.getElementById('modulo').value;document.getElementById('configuracion').classList.add('oculto');document.getElementById('sistema').classList.remove('oculto');actualizarPantalla();}function turnoFormateado(){return serie+numeroActual.toString().padStart(2,'0');}function actualizarPantalla(){document.getElementById('numeroTurno').textContent=turnoFormateado();document.getElementById('textoModulo').textContent=modulo;actualizarHistorial();guardar();}function actualizarHistorial(){const l=document.getElementById('historial');l.innerHTML='';historial.forEach(i=>{const li=document.createElement('li');li.textContent=i;l.appendChild(li);});}function limpiarHistorial(){if(confirm('¿Desea borrar el historial de últimos llamados?')){historial=[];guardar();actualizarHistorial();}}function sonido(){const c=new(window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator();const g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=800;o.start();g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.4);o.stop(c.currentTime+.4);}function anunciar(){speechSynthesis.cancel();const m=new SpeechSynthesisUtterance(`Atención por favor. Turno ${turnoFormateado()}. Diríjase a ${modulo}.`);m.lang='es-CL';speechSynthesis.speak(m);}function siguienteTurno(){numeroActual++;if(numeroActual>99){numeroActual=1;if(serie==='A')serie='B';else if(serie==='B')serie='C';else if(serie==='C')serie='D';else serie='A';}historial.unshift(turnoFormateado()+' - '+modulo);historial=historial.slice(0,5);actualizarPantalla();sonido();setTimeout(anunciar,500);}function turnoAnterior(){numeroActual--;if(numeroActual<1){if(serie==='B'){serie='A';numeroActual=99;}else if(serie==='C'){serie='B';numeroActual=99;}else if(serie==='D'){serie='C';numeroActual=99;}else{serie='D';numeroActual=99;}}actualizarPantalla();sonido();}function reiniciarSistema(){serie='A';numeroActual=1;actualizarPantalla();}function volverConfiguracion(){document.getElementById('sistema').classList.add('oculto');document.getElementById('configuracion').classList.remove('oculto');}document.addEventListener('keydown',e=>{if(e.code==='PageDown'||e.keyCode===34){e.preventDefault();siguienteTurno();}if(e.code==='PageUp'||e.keyCode===33){e.preventDefault();turnoAnterior();}});</script></body></html>
