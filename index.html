<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sistema Turnos V3</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Segoe UI,Arial,sans-serif;background:#f1f5f9}.pantalla{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}.card{background:#fff;width:750px;padding:30px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.15)}h1{text-align:center;margin-bottom:20px}label{display:block;font-weight:bold;margin:12px 0 6px}select{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px}.series{display:flex;gap:20px;margin:10px 0}.btn{width:100%;padding:15px;border:none;border-radius:10px;color:#fff;cursor:pointer;margin-top:10px}.azul{background:#2563eb}.rojo{background:#dc2626}.oculto{display:none}.turno{background:#2563eb;color:#fff;border-radius:20px;padding:25px;text-align:center}.numero{font-size:110px;font-weight:bold}.modulo{font-size:24px}.botones{display:flex;gap:10px;margin-top:20px}.botones button{flex:1;padding:15px;border:none;border-radius:10px;color:#fff;cursor:pointer}.verde{background:#16a34a}.gris{background:#475569}.historial{margin-top:20px}.historial li{padding:6px;border-bottom:1px solid #ddd;list-style:none}.info{margin-top:15px;background:#dbeafe;padding:10px;border-radius:10px;text-align:center}</style></head>
<body>
<div id="configuracion" class="pantalla"><div class="card"><h1>Sistema de Turnos V3</h1><label>Módulo</label><select id="modulo"><option>Admisión</option><option>Matrículas</option><option>Becas</option><option>Créditos</option></select><label>Series habilitadas</label><div class="series"><label><input type="checkbox" class="serie" value="A" checked> A</label><label><input type="checkbox" class="serie" value="B" checked> B</label><label><input type="checkbox" class="serie" value="C" checked> C</label><label><input type="checkbox" class="serie" value="D" checked> D</label></div><button class="btn azul" onclick="iniciarSistema()">Iniciar Sistema</button><button class="btn rojo" onclick="limpiarHistorial()">Limpiar Últimos Llamados</button></div></div>
<div id="sistema" class="pantalla oculto"><div class="card"><div class="turno"><div>AHORA ATENDIENDO</div><div id="numeroTurno" class="numero">A01</div><div id="textoModulo" class="modulo"></div></div><div class="botones"><button class="verde" onclick="siguienteTurno()">Siguiente</button><button class="rojo" onclick="reiniciarSistema()">Reiniciar</button><button class="gris" onclick="volverConfiguracion()">Configuración</button></div><div class="historial"><h3>Últimos llamados</h3><ul id="historial"></ul></div><div class="info">PageDown=Siguiente | PageUp=Anterior | Home=Repetir llamado</div></div></div>
<script>
let serie='A',numeroActual=1,modulo='Admisión',historial=[],seriesActivas=['A','B','C','D'];
window.onload=()=>{const d=localStorage.getItem('turnosV3');if(d){const c=JSON.parse(d);serie=c.serie||'A';numeroActual=c.numeroActual||1;modulo=c.modulo||'Admisión';historial=c.historial||[];seriesActivas=c.seriesActivas||['A','B','C','D'];}};
function guardar(){localStorage.setItem('turnosV3',JSON.stringify({serie,numeroActual,modulo,historial,seriesActivas}));}
function iniciarSistema(){seriesActivas=[...document.querySelectorAll('.serie:checked')].map(x=>x.value);if(seriesActivas.length===0){alert('Seleccione al menos una serie');return;}modulo=document.getElementById('modulo').value;serie=seriesActivas.includes(serie)?serie:seriesActivas[0];document.getElementById('configuracion').classList.add('oculto');document.getElementById('sistema').classList.remove('oculto');actualizarPantalla();}
function turnoFormateado(){return serie+numeroActual.toString().padStart(2,'0');}
function actualizarPantalla(){numeroTurno.textContent=turnoFormateado();textoModulo.textContent=modulo;const ul=document.getElementById('historial');ul.innerHTML='';historial.forEach(h=>{let li=document.createElement('li');li.textContent=h;ul.appendChild(li);});guardar();}
function siguienteSerie(){let i=seriesActivas.indexOf(serie);serie=seriesActivas[(i+1)%seriesActivas.length];}
function serieAnterior(){let i=seriesActivas.indexOf(serie);serie=seriesActivas[(i-1+seriesActivas.length)%seriesActivas.length];}
function sonido(){const c=new(window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator();const g=c.createGain();o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.3);o.stop(c.currentTime+.3);}
function anunciar(){speechSynthesis.cancel();const m=new SpeechSynthesisUtterance(`Atención por favor. Turno ${turnoFormateado()}. Diríjase a ${modulo}.`);m.lang='es-CL';speechSynthesis.speak(m);}
function siguienteTurno(){numeroActual++;if(numeroActual>99){numeroActual=1;siguienteSerie();}historial.unshift(turnoFormateado()+' - '+modulo);historial=historial.slice(0,5);actualizarPantalla();sonido();setTimeout(anunciar,400);}
function turnoAnterior(){numeroActual--;if(numeroActual<1){serieAnterior();numeroActual=99;}actualizarPantalla();sonido();}
function reiniciarSistema(){serie=seriesActivas[0];numeroActual=1;actualizarPantalla();}
function limpiarHistorial(){if(confirm('¿Borrar historial?')){historial=[];actualizarPantalla();}}
function volverConfiguracion(){document.getElementById('sistema').classList.add('oculto');document.getElementById('configuracion').classList.remove('oculto');}
document.addEventListener('keydown',e=>{if(e.code==='PageDown'||e.keyCode===34){e.preventDefault();siguienteTurno();}if(e.code==='PageUp'||e.keyCode===33){e.preventDefault();turnoAnterior();}if(e.code==='Home'||e.keyCode===36){e.preventDefault();anunciar();}});
</script></body></html>
